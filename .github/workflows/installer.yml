name: Build Custom Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Installer (${{ matrix.os }} - ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: aethel-installer.exe
            output_name: AethelInstaller-Windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: aethel-installer
            output_name: AethelInstaller-Linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: aethel-installer
            output_name: AethelInstaller-macOS-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: aethel-installer
            output_name: AethelInstaller-macOS-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Build Aethel Custom Installer Binary
        run: cargo build --release --package aethel-installer --target ${{ matrix.target }}

      - name: Package Installer Binary
        shell: bash
        run: |
          mkdir -p dist-installer
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist-installer/${{ matrix.output_name }}"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: dist-installer/*

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*
