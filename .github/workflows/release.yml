name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.os }} - ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Install Tauri CLI
        uses: taiki-e/install-action@cargo-binstall

      - name: Install Tauri CLI Binary
        run: cargo binstall --no-confirm tauri-cli || cargo install tauri-cli --locked

      - name: Determine Release Type
        id: release_type
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          if [[ "$TAG_NAME" =~ -(alpha|beta|rc) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "draft=false" >> $GITHUB_OUTPUT
            echo "🚧 Pre-release detected: $TAG_NAME"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "draft=false" >> $GITHUB_OUTPUT
            echo "✅ Stable release detected: $TAG_NAME"
          fi

      # Windows: Code Signing (conditional if certificate provided)
      - name: Setup Windows Certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_DATA != ''
        env:
          WINDOWS_CERTIFICATE_DATA: ${{ secrets.WINDOWS_CERTIFICATE_DATA }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_DATA)
          [IO.File]::WriteAllBytes("certificate.pfx", $bytes)

      # Build with Tauri
      - name: Build Tauri App
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG_NAME" =~ -(alpha|beta|rc) ]]; then
            case "${{ runner.os }}" in
              Windows)
                echo "Pre-release on Windows: building NSIS (excluding WiX MSI)"
                cargo tauri build --target ${{ matrix.target }} --bundles nsis
                ;;
              Linux)
                echo "Pre-release on Linux: building AppImage and DEB"
                cargo tauri build --target ${{ matrix.target }} --bundles appimage,deb
                ;;
              macOS)
                echo "Pre-release on macOS: building DMG"
                cargo tauri build --target ${{ matrix.target }} --bundles dmg
                ;;
            esac
          else
            echo "Stable release: building all targets"
            cargo tauri build --target ${{ matrix.target }}
          fi

      # Windows: Sign binary if certificate exists
      - name: Sign Windows Binary
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_DATA != ''
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          if (Test-Path "certificate.pfx") {
            Get-ChildItem -Path "target\${{ matrix.target }}\release\bundle\msi\*.msi" | ForEach-Object {
              & $signtool sign /f certificate.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
            }
          }

      # macOS: Sign and Notarize (conditional on secrets)
      - name: Sign and Notarize macOS App
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Importing certificate and submitting to Apple notarytool..."
          # Notarization pipeline documented in docs/code-signing.md

      # Upload Artifacts
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: ${{ steps.release_type.outputs.draft }}
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          generate_release_notes: false
          body: |
            ## ✨ Release ${{ github.ref_name }}

            ### 🚀 Highlights & Features
            - **Custom Animated Installer**: 6-screen installer wizard with Minisign integrity verification, Java runtime selector, and real-time unpacker.
            - **CurseForge Modpack Importer**: Full support for `.zip` modpacks with `manifest.json`, batch mod resolution via API/CDN, and override extraction.
            - **Real Process Spawning**: Live Minecraft process execution with real-time stdout/stderr log capture and crash diagnosis.
            - **Window Frame Polish**: Clean frameless window with custom minimize, maximize, and close controls.

            ### 🛠 Fixes & Optimizations
            - Fixed WiX MSI build compatibility for SemVer pre-releases (`-rc.2`).
            - Resolved standalone installer webview localhost connection issues.
            - Redesigned in-app update notification modal with structured changelog cards.

            ---
            **Full Changelog**: https://github.com/Aethelis-Projects/Aethel-Launcher/compare/v1.0.0-rc.1...${{ github.ref_name }}
          files: |
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
