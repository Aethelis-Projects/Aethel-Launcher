<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFE0" />
      <stop offset="35%" stop-color="#00B4D8" />
      <stop offset="70%" stop-color="#7209B7" />
      <stop offset="100%" stop-color="#F72585" />
    </linearGradient>
  </defs>

  <!-- Multi-chromatic Cyber Gradient Edition -->
  <g>
    <!-- Primary Arch -->
    <path
      d="M 130 395 
         L 238 135 
         C 246 116 266 116 274 135 
         L 332 260 
