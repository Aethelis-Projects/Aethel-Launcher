         C 260 332 205 338 168 395 
         Z"
      stroke="url(#cyberGradient)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Inner Loop Counter -->
    <path
      d="M 256 195 
         L 225 275 
         C 221 285 228 295 238 295 
         L 278 290 
         C 288 288 294 278 289 268 
         Z"
      stroke="url(#cyberGradient)"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Detached Right Leg -->
    <path
      d="M 346 288 
         L 395 395"
      stroke="url(#cyberGradient)"
      stroke-width="26"
      stroke-linecap="round"
    />
  </g>
</svg>
