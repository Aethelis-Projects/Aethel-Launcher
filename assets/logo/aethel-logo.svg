<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="aethelCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFE0" />
      <stop offset="50%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Main Stylized 'A' Emblem -->
  <g filter="url(#neonGlow)">
    <!-- Primary Arch and Loop -->
    <path
      d="M 120 400 
         L 236 128 
         C 244 110 268 110 276 128 
         L 336 260 
         C 346 282 334 316 308 322 
         C 260 334 200 340 160 400 
         Z"
      stroke="url(#aethelCyan)"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Inner Aperture Counter -->
    <path
      d="M 256 186 
         L 220 280 
         C 216 290 224 300 236 300 
         L 282 294 
         C 294 292 300 280 294 270 
         Z"
      stroke="url(#aethelCyan)"
      stroke-width="22"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Detached Dynamic Right Leg -->
    <path
      d="M 350 286 
         L 404 400"
      stroke="url(#aethelCyan)"
      stroke-width="28"
      stroke-linecap="round"
    />
  </g>
</svg>
