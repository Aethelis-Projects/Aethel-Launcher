<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="discBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="65%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#030407" />
    </radialGradient>

    <!-- Wireframe grid pattern -->
    <pattern id="wireGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <!-- Neon Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00FFE0" />
    </linearGradient>

    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="b2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="35" result="b3" />
      <feMerge>
        <feMergeNode in="b3" />
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Circle Clip for Discord -->
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="256" />
    </clipPath>
  </defs>

  <!-- Discord Circular Base -->
  <g clip-path="url(#circleClip)">
    <rect width="512" height="512" fill="url(#discBg)" />
    <rect width="512" height="512" fill="url(#wireGrid)" opacity="0.7" />

    <!-- Ambient Glow Blobs -->
    <circle cx="120" cy="200" r="140" fill="#00F5D4" opacity="0.18" filter="blur(60px)" />
    <circle cx="400" cy="300" r="140" fill="#7B2CBF" opacity="0.22" filter="blur(60px)" />

    <!-- Stylized Emblem -->
    <g filter="url(#bloom)">
      <path
        d="M 140 380 
           L 240 145 
           C 248 128 264 128 272 145 
           L 326 260 
           C 334 278 324 306 304 312 
           C 264 322 212 328 174 380 
           Z"
        stroke="url(#cyanGlow)"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="M 256 200 
           L 228 272 
           C 224 282 230 290 240 290 
           L 274 286 
           C 284 284 288 274 284 266 
           Z"
        stroke="url(#cyanGlow)"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="M 340 286 
           L 384 380"
        stroke="url(#cyanGlow)"
        stroke-width="24"
        stroke-linecap="round"
      />
    </g>
  </g>
</svg>
