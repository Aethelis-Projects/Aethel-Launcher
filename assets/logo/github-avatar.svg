<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="gitBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="60%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#030406" />
    </radialGradient>

    <!-- Neon Glow -->
    <linearGradient id="gitCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00FFE0" />
    </linearGradient>

    <filter id="gitBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="30" result="b3" />
      <feMerge>
        <feMergeNode in="b3" />
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="squircleClip">
      <rect width="512" height="512" rx="104" />
    </clipPath>
  </defs>

  <!-- Squircle Base for GitHub -->
  <g clip-path="url(#squircleClip)">
    <rect width="512" height="512" fill="url(#gitBg)" />

    <!-- Subtle Outer Border Rim -->
    <rect width="512" height="512" fill="none" stroke="#1e293b" stroke-width="4" opacity="0.6" />

    <!-- Ambient Center Glow -->
    <circle cx="256" cy="256" r="160" fill="#00F5D4" opacity="0.15" filter="blur(50px)" />

    <!-- Stylized Emblem -->
    <g filter="url(#gitBloom)">
      <path
        d="M 134 388 
           L 240 140 
           C 248 122 264 122 272 140 
           L 328 260 
           C 336 280 326 308 304 314 
           C 264 324 212 330 170 388 
           Z"
        stroke="url(#gitCyan)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="M 256 195 
           L 226 274 
           C 222 284 228 292 238 292 
           L 276 288 
           C 286 286 290 276 286 268 
           Z"
        stroke="url(#gitCyan)"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="M 342 288 
           L 388 388"
        stroke="url(#gitCyan)"
        stroke-width="26"
        stroke-linecap="round"
      />
    </g>
  </g>
</svg>
