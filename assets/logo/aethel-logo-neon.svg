<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1a2e" />
      <stop offset="60%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#040508" />
    </radialGradient>
    
    <!-- Neon Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00FFE0" />
    </linearGradient>

    <!-- Ambient Bloom -->
    <radialGradient id="ambientTeal" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#7B2CBF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <!-- Multi-stage Glow Filter -->
    <filter id="hyperGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="36" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" rx="32" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="200" fill="url(#ambientTeal)" />

  <!-- Stylized 'A' Glyph -->
  <g filter="url(#hyperGlow)">
    <!-- Primary Arch -->
    <path
      d="M 130 395 
         L 238 135 
         C 246 116 266 116 274 135 
         L 332 260 
         C 342 282 330 314 306 320 
         C 260 332 205 338 168 395 
         Z"
      stroke="url(#neonCyan)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Inner Loop Counter -->
    <path
      d="M 256 195 
         L 225 275 
         C 221 285 228 295 238 295 
         L 278 290 
         C 288 288 294 278 289 268 
         Z"
      stroke="url(#neonCyan)"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Detached Right Leg -->
    <path
      d="M 346 288 
         L 395 395"
      stroke="url(#neonCyan)"
      stroke-width="26"
      stroke-linecap="round"
    />
  </g>
</svg>
