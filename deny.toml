# cargo-deny configuration for Aethel Launcher (Aethelis Projects)

[graph]
all-features = false
no-default-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[advisories]
unmaintained = "workspace"
ignore = [
    "RUSTSEC-2025-0100", # unic-ucd-ident via tauri-utils
    "RUSTSEC-2025-0098", # unic-ucd-version via tauri-utils
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
